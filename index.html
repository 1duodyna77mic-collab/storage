<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Wilberthub">
  <title>Wilberthub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Cpath d='M18 20h8l6 18 6-18h8l-8 24h-8l-4-12-4 12h-8z' fill='white'/%3E%3C/svg%3E">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#6d28d9;font:600 15px/1 system-ui,sans-serif;letter-spacing:.08em;z-index:999999}
  </style>
</head>
<body>
  <div id="boot">WILBERTHUB</div>
  <script>
  (async()=>{
    const source='https://raw.githubusercontent.com/1duodyna77mic-collab/storage/0eef1a31d3966fcf062ee6ab7df61d7e57626ef8/index.html';
    try{
      const res=await fetch(source,{cache:'no-store'});
      if(!res.ok) throw new Error('source '+res.status);
      let html=await res.text();
      html=html.replace(/opium\.best/gi,'Wilberthub').replace(/opium/gi,'Wilberthub');
      html=html.replace(/<div class=ac-banner id=acLeft><\/div><div class=ac-banner id=acRight><\/div>/gi,'');
      html=html.replace(/<canvas id=stars><\/canvas>/gi,'');
      const theme=`
<style id="wilberthub-theme">
:root{--accent:#7c3aed!important;--accent-bright:#8b5cf6!important;--accent-dim:#6d28d9!important;--accent-glow:rgba(124,58,237,.22)!important}
html,body{background:#fff!important;color:#24133f!important}
body{overflow:hidden!important}
.content{padding-left:max(16px,4vw)!important;padding-right:max(16px,4vw)!important}
.wordmark{font-family:Inter,system-ui,sans-serif!important;font-style:normal!important;font-weight:750!important;font-size:clamp(42px,8vw,76px)!important;letter-spacing:-.055em!important;background:linear-gradient(135deg,#4c1d95,#8b5cf6)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.tagline{font-family:Inter,system-ui,sans-serif!important;color:#6b5b7d!important;font-size:clamp(12px,1.5vw,15px)!important}
.search-bar,.games-search-bar,.effects-search-bar,.ai-input-wrapper{background:#fff!important;border:1px solid #e9e1f5!important;box-shadow:0 8px 30px rgba(76,29,149,.08)!important}
.search-bar:focus-within,.games-search-bar:focus-within,.effects-search-bar:focus-within,.ai-input-wrapper:focus-within{border-color:#a78bfa!important;box-shadow:0 0 0 4px rgba(124,58,237,.10)!important}
.search-bar input,.addr-input,.games-search-input,.effects-search-input,.ai-input-wrapper textarea{color:#2f2140!important}
.search-bar input::placeholder,.games-search-input::placeholder,.effects-search-input::placeholder,.ai-input-wrapper textarea::placeholder{color:#9b8aaa!important}
.shortcut,.game-card,.effect-btn{background:#fff!important;border:1px solid #ece6f5!important;box-shadow:0 8px 24px rgba(76,29,149,.07)!important}
.shortcut:hover,.game-card:hover,.effect-btn:hover{background:#faf7ff!important;border-color:#c4b5fd!important;box-shadow:0 12px 30px rgba(76,29,149,.12)!important}
.shortcut span,.game-card-name,.effect-btn span{color:#3f3150!important}
.panel,.games-screen,.effects-screen,.ai-screen{background:#fff!important}
.panel-bar-wrap,.game-player-bar-wrap{background:#fff!important;border-bottom:1px solid #eee8f7!important}
.addr-wrap,.game-player-id{background:#faf8fd!important;border-color:#e9e1f5!important}
.bottom-nav{background:rgba(255,255,255,.97)!important;border-top:1px solid #ece6f5!important;box-shadow:0 -8px 24px rgba(76,29,149,.06)!important}
.nav-stat{color:#8b7d99!important}.nav-item{color:#6f627c!important}.nav-item:hover,.nav-item.active{color:#6d28d9!important}.nav-item.active::before{background:#7c3aed!important}
.settings-inner{background:#fff!important;box-shadow:0 24px 70px rgba(76,29,149,.16)!important;border:1px solid #eee8f7}
.settings-sidebar{border-right-color:#eee8f7!important}.sidebar-item.active{color:#5b21b6!important;border-left-color:#7c3aed!important;background:#f5f3ff!important}.settings-tabs{border-bottom-color:#eee8f7!important}.tab-item{color:#74677f!important;border-color:#e8e0f2!important}.tab-item.active{color:#5b21b6!important;border-color:#a78bfa!important;background:#f3efff!important}
.screen-header{border-bottom-color:#eee8f7!important}.screen-header-title{font-family:Inter,system-ui,sans-serif!important;font-style:normal!important;color:#4c1d95!important;font-weight:750!important}.screen-header-sub{color:#9a8ca6!important}
.settings-panel-section{border-bottom-color:#f0ebf6!important}.category-label{color:#8d7c9c!important}.setting-label{color:#3d2f4c!important}.setting-input,.setting-select{background:#faf8fd!important;border-color:#e5dcef!important;color:#443551!important}.setting-action-btn{background:#f6f2fb!important;border-color:#e5dcef!important;color:#5b21b6!important}.toggle.on,.cloud-toggle.on{background:#7c3aed!important;border-color:#7c3aed!important}
.ai-sidebar{background:#fbf9fe!important;border-right-color:#eee8f7!important}.ai-sidebar-header,.ai-sidebar-actions{border-bottom-color:#eee8f7!important}.ai-sidebar-btn,.ai-recent-item{color:#665873!important}.ai-sidebar-btn:hover,.ai-recent-item:hover{background:#f4f0fa!important;color:#3f3150!important}.ai-recent-item.active{background:#f0eafe!important;color:#4c1d95!important}.ai-message.user .ai-message-text{background:#eee8ff!important;color:#3f3150!important}.ai-message.assistant .ai-message-text{background:#fff!important;border-color:#e9e1f5!important;color:#3f3150!important}.ai-model-select{background:#f0eafe!important;color:#6d28d9!important}.ai-send-btn{background:#7c3aed!important}.ai-send-btn:hover{background:#8b5cf6!important}
.game-player-loading,.games-loading,.effects-loading{color:#8b7d99!important}.game-player iframe,.panel iframe{background:#fff!important}
#controllerMapperModal{background:rgba(255,255,255,.96)!important}#controllerMapperModal>div>div{background:#fff!important;border-color:#e9e1f5!important;color:#3f3150!important}
.ext-prompt{background:rgba(255,255,255,.96)!important;border-color:#e9e1f5!important;box-shadow:0 16px 40px rgba(76,29,149,.14)!important;color:#3f3150!important}
.ac-banner{display:none!important}canvas#stars{display:none!important}
button,.shortcut,.game-card,.effect-btn,.nav-item,.nb,.setting-action-btn,.toggle,.cloud-toggle{min-height:40px}
@media(max-width:600px){.wordmark{font-size:clamp(40px,14vw,60px)!important}.shortcuts{width:min(520px,100%)!important}.bottom-nav{padding:0 8px!important}.nav-item{padding-left:9px!important;padding-right:9px!important}.settings-inner{border-left:0!important;border-right:0!important}.screen-header{padding-left:12px!important}}
</style>`;
      html=html.replace('</head>',theme+'</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById('boot').textContent='WILBERTHUB — LOAD ERROR';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
